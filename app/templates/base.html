<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}US AI Reg Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1><a href="/">US AI Reg Tracker</a></h1>
      <nav>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Home</a>
        <a href="/about" class="{% if request.url.path == '/about' %}active{% endif %}">About</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="app-footer">
      Operational briefing · Not legal advice · Data updated periodically · Sources linked on each jurisdiction
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
