<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ellavox AI Reg Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1><a href="/">Ellavox <span>AI Reg Tracker</span></a></h1>
      <nav>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Home</a>
        <a href="/about" class="{% if request.url.path == '/about' %}active{% endif %}">About</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="app-footer">
      Operational briefing for Ellavox · Not legal advice · Local-only app
    </footer>
  </div>
</body>
</html>
